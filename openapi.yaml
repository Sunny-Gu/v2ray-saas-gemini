openapi: 3.0.3
info:
  title: V2Ray SaaS Platform API
  description: API documentation for the V2Ray SaaS Platform, covering both the user-facing portal and the admin panel.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Portal API Server
  - url: http://localhost:8081/api/v1/admin
    description: Admin API Server
paths:
  /user/register:
    post:
      tags:
        - Portal - User
      summary: Register a new user
      description: Creates a new user account.
      operationId: registerUser
      requestBody:
        description: User registration details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  user_id:
                    type: integer
                    example: 1
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user/login:
    post:
      tags:
        - Portal - User
      summary: User login
      description: Authenticates a user and returns a JWT.
      operationId: loginUser
      requestBody:
        description: User login credentials
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                    example: "ey..."
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile:
    get:
      tags:
        - Portal - Profile
      summary: Get user profile
      description: Retrieves the profile information for the currently authenticated user.
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful retrieval of user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /store/plans:
    get:
      tags:
        - Portal - Store
      summary: List available plans
      description: Retrieves a list of all purchasable service plans.
      operationId: getStorePlans
      responses:
        '200':
          description: A list of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
  /store/purchase:
    post:
      tags:
        - Portal - Store
      summary: Purchase a plan
      description: Purchase a new service plan using the account balance.
      operationId: purchasePlan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Plan purchased successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Plan purchased successfully
                  subscription:
                    $ref: '#/components/schemas/Subscription'
        '400':
          description: Bad request (e.g., insufficient balance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /subscription/:
    get:
      tags:
        - Portal - Subscription
      summary: Get active subscription
      description: Retrieves the details of the user's current active subscription.
      operationId: getActiveSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No active subscription found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRegistration:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: "password123"
    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: "password123"
    UserProfile:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        balance:
          type: number
          format: float
          example: 100.50
        plan_name:
          type: string
          example: "基础套餐"
        plan_expiry_date:
          type: string
          format: date
          example: "2025-12-31"
        used_traffic_gb:
          type: number
          format: float
          example: 50.5
        total_traffic_gb:
          type: number
          format: float
          example: 200.0
    Plan:
      type: object
      properties:
        ID:
          type: integer
          example: 1
        Name:
          type: string
          example: "基础套餐"
        Description:
          type: string
          example: "一个非常棒的入门套餐。"
        Price:
          type: number
          format: float
          example: 50.0
        TrafficGB:
          type: number
          format: float
          example: 200.0
        DurationDays:
          type: integer
          example: 30
        IsActive:
          type: boolean
          example: true
        IsFeatured:
          type: boolean
          example: true
    Subscription:
      type: object
      properties:
        ID:
          type: integer
          example: 1
        UserID:
          type: integer
          example: 1
        PlanID:
          type: integer
          example: 1
        ExpiredAt:
          type: string
          format: date-time
          example: "2025-12-31T23:59:59Z"
        TotalTrafficGB:
          type: number
          format: float
          example: 200.0
        UsedTrafficGB:
          type: number
          format: float
          example: 50.5
        SubscriptionURL:
          type: string
          format: uuid
          example: "unique-uuid-string"
    Error:
      type: object
      properties:
        message:
          type: string
          example: "An error occurred"
