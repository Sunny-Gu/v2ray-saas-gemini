version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: v2ray-saas-db
    restart: always
    environment:
      MYSQL_DATABASE: v2ray_saas
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
